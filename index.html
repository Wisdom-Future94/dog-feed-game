<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>吧唧狗狗 · 原型</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff5df; color: #49352d; }
    #app { width: min(100vw, 520px); height: min(100vh, 860px); position: relative; overflow: hidden; background: linear-gradient(#9fe5ff 0 54%, #b7e47d 54%); touch-action: none; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud { position: absolute; inset: 16px 18px auto; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .pill { padding: 8px 13px; border-radius: 999px; background: #fffdf5dd; box-shadow: 0 3px 0 #dcae68; font-weight: 800; }
    .pill small { font-weight: 500; opacity: .65; margin-right: 4px; }
    .hint { position: absolute; left: 0; right: 0; top: 32%; text-align: center; color: #fff; text-shadow: 0 2px 4px #6a7d7e; font-weight: 900; pointer-events: none; font-size: 20px; }
    .hint span { display: inline-block; background: #5f7d71cc; padding: 10px 16px; border-radius: 16px; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: #27444c55; }
    .card { width: 82%; padding: 28px 22px; text-align: center; background: #fffdf4; border: 4px solid #f0b24e; border-radius: 28px; box-shadow: 0 12px 0 #d68a50; }
    h1 { margin: 0 0 8px; font-size: 36px; color: #e97245; }
    .subtitle { margin: 0 0 20px; color: #85655a; }
    button { border: 0; padding: 13px 26px; border-radius: 999px; color: #fff; background: #ef7950; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 #c9533a; cursor: pointer; }
    button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9533a; }
    .result-score { font-size: 46px; font-weight: 1000; color: #ef7950; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="game" width="520" height="860" aria-label="吧唧狗狗游戏画布"></canvas>
    <div class="hud"><div class="pill"><small>得分</small><b id="score">0</b></div><div class="pill"><small>连击</small><b id="combo">0</b></div><div class="pill"><small>剩余</small><b id="time">30</b>s</div></div>
    <div id="hint" class="hint"><span>拖动并松开，把食物抛给狗狗！</span></div>
    <div id="start" class="overlay"><section class="card"><h1>吧唧狗狗</h1><p class="subtitle">给狗狗们喂食，看它们一起跳舞！</p><button id="startBtn">开始喂食</button></section></div>
    <div id="result" class="overlay hidden"><section class="card"><h1>吃饱啦！</h1><p>狗狗们为你跳一支庆祝舞</p><div class="result-score" id="resultScore">0</div><p id="resultText">本轮连击 0</p><button id="againBtn">再喂一轮</button></section></div>
  </main>
  <script>
    const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, ground = 650;
    const scoreEl = document.querySelector('#score'), comboEl = document.querySelector('#combo'), timeEl = document.querySelector('#time');
    const hint = document.querySelector('#hint'), start = document.querySelector('#start'), result = document.querySelector('#result');
    const dogs = [
      { name: '豆豆', x: 135, color: '#d98953', ear: '#9d5a3d', scale: 1, phase: 0 },
      { name: '奶盖', x: 260, color: '#fff4d5', ear: '#c89570', scale: .95, phase: 1.8 },
      { name: '团子', x: 385, color: '#8176c9', ear: '#59549f', scale: 1.02, phase: 3.2 }
    ];
    const foods = ['🍖', '🧀', '🥓', '🍪', '🥩'];
    let state = 'idle', score = 0, combo = 0, bestCombo = 0, left = 30, last = 0, food = null, spawn = 0, dance = 0, audio;
    const rand = (a,b) => a + Math.random()*(b-a);
    function sound(type) {
      try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); const o=audio.createOscillator(), g=audio.createGain();
        o.type = type === 'miss' ? 'sine' : 'triangle'; o.frequency.value = type === 'catch' ? 310 + Math.random()*120 : type === 'combo' ? 620 : 150; g.gain.setValueAtTime(.0001,audio.currentTime); g.gain.exponentialRampToValueAtTime(type==='catch'?.12:.08,audio.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.14); o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime+.15);
      } catch (_) {}
    }
    function reset() { score=combo=bestCombo=0; left=30; food=null; spawn=0; dance=0; state='play'; last=performance.now(); start.classList.add('hidden'); result.classList.add('hidden'); hint.classList.remove('hidden'); scoreEl.textContent=0; comboEl.textContent=0; timeEl.textContent=30; requestAnimationFrame(loop); }
    function beginThrow(x,y) { if(state!=='play') return; food={x:W/2,y:ground-95,tx:x,ty:y,age:0,emoji:foods[Math.floor(Math.random()*foods.length)],target:nearestDog(x)}; hint.classList.add('hidden'); }
    function nearestDog(x) { return dogs.reduce((a,d,i)=>Math.abs(d.x-x)<Math.abs(dogs[a].x-x)?i:a,0); }
    function release(x,y) { if(!food || state!=='play') return; food.tx=Math.max(45,Math.min(W-45,x)); food.ty=Math.max(180,Math.min(ground-55,y)); food.target=nearestDog(food.tx); food.age=0; }
    function update(dt) { left-=dt; if(left<=0){ left=0; state='dance'; dance=0; food=null; result.classList.add('hidden'); }
      if(state==='play'){ spawn+=dt; if(food) { food.age+=dt; const t=Math.min(food.age/.78,1); food.x += (food.tx-food.x)*dt*5; food.y = (ground-95) - Math.sin(t*Math.PI)*Math.max(100,ground-95-food.ty); if(t>=1){ const d=dogs[food.target]; const hit=Math.abs(food.tx-d.x)<58; if(hit){ combo++; bestCombo=Math.max(bestCombo,combo); score += 10 + combo*2; sound(combo>=5?'combo':'catch'); flash='吧唧！'; flashAt=performance.now(); } else {combo=0; sound('miss'); flash='没接到…'; flashAt=performance.now();} food=null; } } }
      if(state==='dance'){ dance+=dt; if(dance>3.8){state='result'; document.querySelector('#resultScore').textContent=score; document.querySelector('#resultText').textContent=`本轮最高连击 ${bestCombo} · 再来一轮？`; result.classList.remove('hidden');} }
      scoreEl.textContent=score; comboEl.textContent=combo; timeEl.textContent=Math.ceil(left); }
    let flash='', flashAt=0;
    function drawDog(d,i) { const t=state==='dance'?Math.sin(dance*10+d.phase)*24:0, jump=state==='play' && food && food.target===i ? Math.max(0,Math.sin(Math.min(food.age/.78,1)*Math.PI))*90 : 0; const x=d.x, y=ground-70-jump-t; ctx.save(); ctx.translate(x,y); ctx.scale(d.scale,d.scale);
      ctx.fillStyle='#0002'; ctx.beginPath(); ctx.ellipse(0,75,51,12,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=d.ear; ctx.beginPath();ctx.ellipse(-34,-20,15,32,-.35,0,Math.PI*2);ctx.ellipse(34,-20,15,32,.35,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=d.color; ctx.beginPath();ctx.arc(0,0,43,0,Math.PI*2);ctx.fill(); ctx.beginPath();ctx.ellipse(0,46,39,29,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#352822'; ctx.beginPath();ctx.arc(-15,-5,4,0,Math.PI*2);ctx.arc(15,-5,4,0,Math.PI*2);ctx.fill(); ctx.fillStyle='#352822';ctx.beginPath();ctx.arc(0,10,8,0,Math.PI*2);ctx.fill();
      if(state==='dance'){ctx.strokeStyle='#352822';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,14,17,.15,Math.PI-.15);ctx.stroke();}
      ctx.fillStyle='#49352d'; ctx.font='bold 15px system-ui'; ctx.textAlign='center'; ctx.fillText(d.name,0,94); ctx.restore(); }
    function draw() { ctx.clearRect(0,0,W,H); const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#9fe5ff'); sky.addColorStop(1,'#d7f3ba'); ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff8'; for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(70+i*115,120+(i%2)*55,25,0,Math.PI*2);ctx.arc(100+i*115,120+(i%2)*55,32,0,Math.PI*2);ctx.arc(130+i*115,120+(i%2)*55,20,0,Math.PI*2);ctx.fill();}
      ctx.fillStyle='#79bd63';ctx.fillRect(0,ground,W,H-ground); ctx.fillStyle='#e4bd73';ctx.fillRect(0,ground,W,12); ctx.fillStyle='#6cae61';ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillText(state==='dance'?'庆祝舞时间！':'把食物抛到狗狗上方',W/2,ground-190);
      dogs.forEach(drawDog); if(food){ctx.font='42px serif';ctx.textAlign='center';ctx.fillText(food.emoji,food.x,food.y);} if(flash && performance.now()-flashAt<650){ctx.fillStyle='#fff';ctx.font='900 31px system-ui';ctx.textAlign='center';ctx.fillText(flash,W/2,260);} }
    function loop(now){ if(state==='idle'||state==='result') return; const dt=Math.min((now-last)/1000,.04); last=now; update(dt); draw(); if(state!=='result') requestAnimationFrame(loop); }
    let drag=false; canvas.addEventListener('pointerdown',e=>{if(state==='play'){drag=true;const r=canvas.getBoundingClientRect();beginThrow((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);}});
    canvas.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const r=canvas.getBoundingClientRect();release((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);});
    document.querySelector('#startBtn').onclick=reset; document.querySelector('#againBtn').onclick=reset; draw();
  </script>
</body>
</html>
