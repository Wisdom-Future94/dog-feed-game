<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>村口追狗 · 原型</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#172b27;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;overflow:hidden}#app{position:relative;width:min(100vw,520px);height:min(100vh,860px);margin:auto;overflow:hidden;background:#79c86b;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:14px;left:15px;right:15px;display:flex;justify-content:space-between;color:#fff;font-weight:900;text-shadow:0 2px 3px #254b2c;pointer-events:none}.badge{padding:7px 12px;border-radius:20px;background:#234c37b8}.tip{position:absolute;top:70px;left:0;right:0;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 4px #29422a;pointer-events:none}.joy{position:absolute;left:22px;bottom:28px;width:126px;height:126px;border:3px solid #ffffff90;border-radius:50%;background:#1f584b77}.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:#fff9;border:3px solid #fff;box-shadow:0 3px 8px #0003}.boost{position:absolute;right:25px;bottom:38px;width:92px;height:92px;border:4px solid #ffd66b;border-radius:50%;background:#df713bd9;color:#fff;font-size:17px;font-weight:1000;box-shadow:0 5px 0 #a84932}.boost:active,.boost.on{transform:translateY(4px);box-shadow:0 1px 0 #a84932;background:#f08b41}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#163c3855}.card{width:84%;padding:27px 21px;text-align:center;background:#fff8e9;border:4px solid #f0a54a;border-radius:27px;box-shadow:0 10px 0 #c56b3e}h1{margin:0 0 8px;color:#d85f3d;font-size:37px}.card p{color:#725d50;line-height:1.55}.card button{border:0;padding:13px 26px;border-radius:99px;background:#df6e43;color:#fff;font-size:18px;font-weight:900;box-shadow:0 5px 0 #ad4935}.hidden{display:none}</style></head>
<body><main id="app"><canvas id="game" width="520" height="860"></canvas><div class="hud"><div class="badge">距离 <span id="dist">0</span>m</div><div class="badge">速度 <span id="speed">0</span></div><div class="badge">状态 <span id="state">快跑</span></div></div><div class="tip" id="tip">狗来了！用摇杆逃跑，找机会掉头追它</div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="boost" id="boost">加速</button><div class="overlay" id="start"><section class="card"><h1>村口追狗</h1><p>一开始狗追你，<br>抓住机会掉头，反过来追狗！</p><button id="startBtn">开始骑车</button></section></div><div class="overlay hidden" id="over"><section class="card"><h1 id="overTitle">追到了！</h1><p id="overText"></p><button id="again">再来一局</button></section></div></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),W=520,H=860;let mode='idle',bike,dog,cam=0,score=0,time=0,last=0,boost=false,joy={x:0,y:0,active:false,id:null},audio;
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function snd(f=440,d=.1){try{audio||=(new(window.AudioContext||window.webkitAudioContext)());let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.07;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(_){}}
function reset(){try{if(!audio){const AudioCtor=window.AudioContext||window.webkitAudioContext;if(AudioCtor)audio=new AudioCtor()}}catch(_){audio=null}mode='run';score=0;time=0;cam=0;bike={x:260,y:620,a:0,v:0};dog={x:260,y:500,a:0,v:0,panic:0};$('start').classList.add('hidden');$('over').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function pointer(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function setJoy(e){let r=$('joy').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),max=46;if(m>max){dx=dx/m*max;dy=dy/m*max}joy.x=dx/max;joy.y=dy/max;$('knob').style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}
function clearJoy(){joy.active=false;joy.x=joy.y=0;$('knob').style.transform='translate(-50%,-50%)'}
function update(dt){if(mode!=='run')return;time+=dt;const turn=joy.x;bike.a+=turn*2.7*dt;const thrust=boost?1.35:.74;bike.v+=(-joy.y)*thrust*dt;bike.v*=Math.pow(.91,dt*60);bike.v=clamp(bike.v,0,boost?5.4:3.5);bike.x+=Math.sin(bike.a)*bike.v*2.2;bike.y-=Math.cos(bike.a)*bike.v*2.2;bike.x=clamp(bike.x,70,450);bike.y=clamp(bike.y,230,720);cam+=(bike.y-535)*dt*.22;
 const d=dog,dx=bike.x-d.x,dy=bike.y-d.y,dist=Math.hypot(dx,dy);if(mode==='run'){if(dist<110){mode='chase';$('state').textContent='掉头追！';$('tip').textContent='漂亮！现在追上那只狗！';snd(660,.14)} if(mode==='run'){d.a=Math.atan2(dx,-dy);d.v=2.1+Math.sin(time*3)*.25;d.x+=Math.sin(d.a)*d.v*2;d.y-=Math.cos(d.a)*d.v*2;} }
 if(mode==='chase'){d.a+=Math.sin(time*5)*.6*dt;d.v=1.9+Math.sin(time*4)*.35;d.x+=Math.sin(d.a)*d.v*2;d.y-=Math.cos(d.a)*d.v*2;bike.x+=Math.sin(bike.a)*bike.v*2.2;bike.y-=Math.cos(bike.a)*bike.v*2.2;if(dist<48){mode='win';score=Math.round(100+Math.max(0,30-time)*8);snd(900,.2);$('overTitle').textContent='追到了！';$('overText').textContent=`你在村口追了 ${Math.round(time)} 秒，得分 ${score}。狗狗正在骂骂咧咧地逃跑。`;$('over').classList.remove('hidden')}}
 bike.x=clamp(bike.x,55,465);bike.y=clamp(bike.y,220,735);d.x=clamp(d.x,45,475);d.y=clamp(d.y,195,745);$('dist').textContent=Math.max(0,Math.round(dist));$('speed').textContent=Math.round(bike.v*18);}
function tree(px,py,s){x.fillStyle='#765238';x.fillRect(px-6,py,s*15,s*40);x.fillStyle='#439653';x.beginPath();x.arc(px,py,s*20,0,7);x.arc(px-20*s,py+15,s*19,0,7);x.arc(px+20*s,py+15,s*19,0,7);x.fill()}
function dogDraw(){let d=dog,wig=Math.sin(time*18)*8;x.save();x.translate(d.x,d.y);x.rotate(d.a);x.fillStyle='#0003';x.beginPath();x.ellipse(0,33,27,9,0,0,7);x.fill();x.strokeStyle='#79412d';x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(-16,18);x.quadraticCurveTo(-38,2,-30,-18+wig);x.stroke();x.fillStyle='#bd7046';x.beginPath();x.ellipse(0,7,27,38,0,0,7);x.fill();x.fillStyle='#9b5439';x.beginPath();x.arc(0,-31,25,0,7);x.fill();x.fillStyle='#69382d';x.beginPath();x.ellipse(-24,-33,10,18,-.5,0,7);x.ellipse(24,-33,10,18,.5,0,7);x.fill();x.fillStyle='#261e1b';x.beginPath();x.arc(-9,-34,3,0,7);x.arc(9,-34,3,0,7);x.arc(0,-22,6,0,7);x.fill();x.restore()}
function bikeDraw(){let b=bike;x.save();x.translate(b.x,b.y);x.rotate(b.a);x.fillStyle='#0003';x.beginPath();x.ellipse(0,30,29,8,0,0,7);x.fill();x.strokeStyle='#2d3336';x.lineWidth=9;x.beginPath();x.arc(-15,17,10,0,7);x.arc(15,17,10,0,7);x.stroke();x.fillStyle='#e9573f';x.fillRect(-16,-22,32,38);x.fillStyle='#f4b94f';x.beginPath();x.arc(0,-27,13,0,7);x.fill();x.strokeStyle='#333';x.lineWidth=5;x.beginPath();x.moveTo(-17,-18);x.lineTo(17,-18);x.stroke();x.fillStyle='#f7f2da';x.beginPath();x.arc(0,-38,10,0,7);x.fill();x.restore()}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#95def6');g.addColorStop(.5,'#b8e48b');g.addColorStop(1,'#77b958');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(0,-cam*.15);x.fillStyle='#d8a765';x.beginPath();x.moveTo(155,0);x.lineTo(365,0);x.lineTo(465,H);x.lineTo(55,H);x.fill();x.fillStyle='#c7965f';x.fillRect(150,0,10,H);x.fillRect(360,0,10,H);for(let y=90;y<H;y+=130){tree(60,y,.8);tree(460,y+50,.75)}x.fillStyle='#debf77';x.fillRect(50,110,85,50);x.fillStyle='#d87855';x.fillRect(50,95,85,20);x.fillStyle='#fff';x.font='bold 13px system-ui';x.fillText('村口杂货铺',58,140);if(dog&&bike){dogDraw();bikeDraw()}x.restore();if(boost&&mode==='run'){x.fillStyle='#fff7';x.font='900 22px system-ui';x.textAlign='center';x.fillText('冲！冲！冲！',W/2,185)}}
function loop(now){if(mode==='idle'||mode==='win')return;let dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();requestAnimationFrame(loop)}
$('joy').addEventListener('pointerdown',e=>{joy.active=true;joy.id=e.pointerId;$('joy').setPointerCapture?.(e.pointerId);setJoy(e)});$('joy').addEventListener('pointermove',e=>{if(joy.active)setJoy(e)});$('joy').addEventListener('pointerup',clearJoy);$('joy').addEventListener('pointercancel',clearJoy);$('boost').addEventListener('pointerdown',()=>{boost=true;$('boost').classList.add('on');snd(520,.08)});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('boost').addEventListener(ev,()=>{boost=false;$('boost').classList.remove('on')}));$('startBtn').onclick=reset;$('again').onclick=reset;draw();})();
</script></body></html>
