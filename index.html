<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>村口追狗 · Safari 试玩版</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#1d352f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    #game{position:relative;margin:auto;width:min(100vw,520px);height:min(100vh,860px);overflow:hidden;background:linear-gradient(#8bdbf5 0,#b8e594 40%,#78bd5b 40%);touch-action:none}
    #road{position:absolute;left:13%;top:0;width:74%;height:130%;background:repeating-linear-gradient(180deg,#d9ad70 0,#d9ad70 58px,#eac486 58px,#eac486 116px);transform:perspective(420px) rotateX(18deg) translateY(-70px);animation:roadMove .55s linear infinite;transform-origin:center top;opacity:.96}
    @keyframes roadMove{from{background-position:0 0}to{background-position:0 116px}}
    .tree{position:absolute;width:54px;height:54px;border-radius:50%;background:#3b904e;border:8px solid #61a957;box-shadow:0 24px 0 -17px #7b563b}.t1{left:18px;top:200px}.t2{right:16px;top:330px}.t3{left:35px;top:530px}.t4{right:36px;top:610px}
    .house{position:absolute;right:15px;top:145px;width:88px;height:60px;border-radius:5px;background:#e8bd77;border-bottom:12px solid #c98a63}.house:before{content:"";position:absolute;left:-9px;top:-22px;border-left:53px solid transparent;border-right:53px solid transparent;border-bottom:28px solid #d86151}
    #bike,#dog{position:absolute;z-index:2;width:72px;height:88px;transition:transform .06s linear}.bike-body{position:absolute;left:17px;top:25px;width:38px;height:48px;border-radius:18px 18px 8px 8px;background:#e55341;border:4px solid #9f3e36}.bike-head{position:absolute;left:25px;top:4px;width:22px;height:22px;border-radius:50%;background:#f6ca66;border:3px solid #433737}.wheel{position:absolute;bottom:0;width:19px;height:19px;border-radius:50%;background:#30373a;border:4px solid #e8e7dc}.w1{left:8px}.w2{right:8px}
    .dog-body{position:absolute;left:12px;top:27px;width:49px;height:40px;border-radius:47% 53% 45% 45%;background:#b96e48}.dog-head{position:absolute;left:15px;top:2px;width:42px;height:43px;border-radius:50%;background:#cf8051}.dog-head:before,.dog-head:after{content:"";position:absolute;top:5px;width:13px;height:23px;border-radius:80% 20%;background:#80503d}.dog-head:before{left:-5px;transform:rotate(-35deg)}.dog-head:after{right:-5px;transform:scaleX(-1) rotate(-35deg)}.dog-eye{position:absolute;top:18px;width:5px;height:5px;border-radius:50%;background:#292020}.e1{left:12px}.e2{right:12px}.dog-nose{position:absolute;left:17px;bottom:6px;width:9px;height:7px;border-radius:50%;background:#302426}.tail{position:absolute;right:-7px;top:42px;width:23px;height:10px;border-radius:100% 0;background:#8e4e38;transform-origin:left center;animation:wag .25s infinite alternate}@keyframes wag{to{transform:rotate(35deg)}}
    #dog.escape .dog-body{animation:run .24s infinite alternate}@keyframes run{to{transform:translateY(-5px)}}
    #hud{position:absolute;z-index:5;left:13px;right:13px;top:13px;display:flex;justify-content:space-between;color:#fff;font-size:14px;font-weight:800;text-shadow:0 2px 3px #24502d}.badge{background:#24523bd9;padding:7px 10px;border-radius:18px}
    #tip{position:absolute;z-index:5;top:70px;left:15px;right:15px;text-align:center;color:#fff;font-size:14px;font-weight:800;text-shadow:0 2px 3px #365239}
    #joystick{position:absolute;z-index:6;bottom:26px;left:22px;width:126px;height:126px;border-radius:50%;border:3px solid #ffffff9c;background:#2057468c}.knob{position:absolute;left:35px;top:35px;width:52px;height:52px;border-radius:50%;background:#ffffffa8;border:3px solid #fff}
    #boost{position:absolute;z-index:6;right:27px;bottom:38px;width:91px;height:91px;border:4px solid #ffe181;border-radius:50%;background:#dc6942;color:#fff;font-size:17px;font-weight:900;box-shadow:0 5px 0 #a84434}#boost.active{transform:translateY(4px);box-shadow:0 1px 0 #a84434;background:#f48b48}
    #start,#result{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#173c3560}.card{width:82%;padding:28px 20px;border:4px solid #efa54c;border-radius:26px;background:#fff8e9;text-align:center;box-shadow:0 10px 0 #bc6a43}.card h1{margin:0;color:#d95e40;font-size:36px}.card p{color:#735b50;line-height:1.55}.card button{border:0;border-radius:30px;padding:13px 25px;background:#df6c45;color:#fff;font-size:18px;font-weight:900;box-shadow:0 5px 0 #ab4838}.hidden{display:none!important}
  </style>
</head>
<body><div id="game">
  <div id="road"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="house"></div>
  <div id="dog"><div class="tail"></div><div class="dog-body"></div><div class="dog-head"><i class="dog-eye e1"></i><i class="dog-eye e2"></i><i class="dog-nose"></i></div></div>
  <div id="bike"><div class="bike-head"></div><div class="bike-body"></div><i class="wheel w1"></i><i class="wheel w2"></i></div>
  <div id="hud"><span class="badge">距离 <b id="distance">150</b>m</span><span class="badge">速度 <b id="speed">20</b></span><span class="badge">状态 <b id="status">快跑</b></span></div><div id="tip">狗在后面追！左下摇杆转向，右下加速冲刺</div>
  <div id="joystick"><div class="knob" id="knob"></div></div><button id="boost">加速</button>
  <div id="start"><div class="card"><h1>村口追狗</h1><p>狗先追你，靠近后立刻掉头，<br>反过来追到它！</p><button id="startButton">开始骑车</button></div></div>
  <div id="result" class="hidden"><div class="card"><h1>追到了！</h1><p id="resultText"></p><button id="againButton">再来一局</button></div></div>
</div>
<script>
(function(){
  var game=document.getElementById('game'),bike=document.getElementById('bike'),dog=document.getElementById('dog'),joy=document.getElementById('joystick'),knob=document.getElementById('knob'),boostBtn=document.getElementById('boost');
  var running=false,phase='escape',bx=224,by=600,dx=224,dy=370,angle=0,turn=0,boost=false,timer=null;
  function pos(el,x,y,a){el.style.left=x+'px';el.style.top=y+'px';el.style.transform='rotate('+a+'deg)'}
  function reset(){running=true;phase='escape';bx=224;by=600;dx=224;dy=370;angle=0;turn=0;boost=false;dog.className='';document.getElementById('start').className='hidden';document.getElementById('result').className='hidden';document.getElementById('status').innerHTML='快跑';document.getElementById('tip').innerHTML='狗在后面追！左下摇杆转向，右下加速冲刺';pos(bike,bx,by,0);pos(dog,dx,dy,0);if(timer)clearInterval(timer);timer=setInterval(tick,30)}
  function tick(){if(!running)return;var sp=boost?5.2:2.7;angle+=turn*4;bx+=Math.sin(angle*Math.PI/180)*sp;by-=Math.cos(angle*Math.PI/180)*sp;bx=Math.max(65,Math.min(385,bx));by=Math.max(160,Math.min(650,by));
    if(phase==='escape'){dy+=2.2;dx+=(bx-dx)*.018;if(dy>by-105){phase='chase';dog.className='escape';document.getElementById('status').innerHTML='掉头追！';document.getElementById('tip').innerHTML='现在轮到你追狗了！按住加速，别让它逃进村里'}}
    else {dy-=boost?2.7:1.5;dx+=(dx<bx?-.7:.7);if(Math.abs(bx-dx)<45&&Math.abs(by-dy)<55){win();return}if(dy<80){lose();return}}
    pos(bike,bx,by,angle);pos(dog,dx,dy,phase==='chase'?-10:180);var dist=Math.max(0,Math.round(Math.sqrt((bx-dx)*(bx-dx)+(by-dy)*(by-dy))));document.getElementById('distance').innerHTML=dist;document.getElementById('speed').innerHTML=Math.round(sp*18);
  }
  function finish(title,text){running=false;clearInterval(timer);document.getElementById('resultText').innerHTML=text;document.querySelector('#result h1').innerHTML=title;document.getElementById('result').className=''}
  function win(){finish('追到了！','土狗边叫边钻进小巷。下一局它会更机灵！')}
  function lose(){finish('它跑掉了！','这次差一点。早点掉头，按住加速追它！')}
  function setKnob(clientX,clientY){var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,xx=clientX-cx,yy=clientY-cy,len=Math.sqrt(xx*xx+yy*yy),max=38;if(len>max){xx=xx/len*max;yy=yy/len*max}knob.style.left=(35+xx)+'px';knob.style.top=(35+yy)+'px';turn=xx/max}
  function clearKnob(){knob.style.left='35px';knob.style.top='35px';turn=0}
  joy.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];setKnob(t.clientX,t.clientY)},{passive:false});joy.addEventListener('touchmove',function(e){e.preventDefault();var t=e.touches[0];setKnob(t.clientX,t.clientY)},{passive:false});joy.addEventListener('touchend',clearKnob);joy.addEventListener('mousedown',function(e){setKnob(e.clientX,e.clientY)});document.addEventListener('mouseup',clearKnob);
  function boostOn(e){if(e)e.preventDefault();boost=true;boostBtn.className='active'}function boostOff(){boost=false;boostBtn.className=''}boostBtn.addEventListener('touchstart',boostOn,{passive:false});boostBtn.addEventListener('touchend',boostOff);boostBtn.addEventListener('touchcancel',boostOff);boostBtn.addEventListener('mousedown',boostOn);boostBtn.addEventListener('mouseup',boostOff);boostBtn.addEventListener('mouseleave',boostOff);
  document.getElementById('startButton').onclick=reset;document.getElementById('againButton').onclick=reset;pos(bike,bx,by,0);pos(dog,dx,dy,180);
})();
</script></body></html>
